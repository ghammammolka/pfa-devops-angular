<div class="container mt-4">

  <!-- 🔥 HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>📚 Liste des cours</h2>

    <!-- 🔄 Switch -->
    <button class="btn btn-dark"
            (click)="toggleView()">
      {{ viewMode === 'table' ? '🎬 Mode Cartes' : '📊 Mode Tableau' }}
    </button>
  </div>

  <!-- 🔍 Recherche -->
  <input class="form-control mb-3 shadow-sm"
         placeholder="🔍 Rechercher par titre..."
         [(ngModel)]="searchText">

  <!-- 🎯 Filtre -->
  <select class="form-control mb-4 shadow-sm"
          [(ngModel)]="selectedLevel">
    <option value="">🎯 Tous les niveaux</option>
    <option value="débutant">Débutant</option>
    <option value="intermédiaire">Intermédiaire</option>
    <option value="avancé">Avancé</option>
  </select>

  <!-- ========================= -->
  <!-- 📊 TABLEAU -->
  <!-- ========================= -->
  <div *ngIf="viewMode === 'table'" class="table-responsive">

    <table class="table table-hover align-middle shadow-sm">

      <thead class="table-dark">
        <tr>
          <th>Image</th>
          <th>Titre</th>
          <th>Niveau</th>
          <th>Formateur</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let c of getFilteredCourses()">

          <!-- IMAGE -->
          <td>
            <img 
              [src]="c.image && c.image.startsWith('http') 
                ? c.image 
                : 'http://localhost:3000/uploads/' + c.image"
              width="60"
              height="60"
              class="rounded-circle border"
              style="object-fit: cover;">
          </td>

          <!-- TITRE -->
          <td class="fw-bold">{{c.title}}</td>

          <!-- NIVEAU -->
          <td>
            <span class="badge px-3 py-2"
              [ngClass]="{
                'bg-success': c.level === 'débutant',
                'bg-warning text-dark': c.level === 'intermédiaire',
                'bg-danger': c.level === 'avancé'
              }">
              {{c.level}}
            </span>
          </td>

          <!-- FORMATEUR -->
          <td>👨‍🏫 {{c.formateur}}</td>

          <!-- ACTIONS -->
          <td>
            <button class="btn btn-info btn-sm me-2 shadow-sm"
                    [routerLink]="['/detail', c._id]">
              Voir
            </button>

            <button class="btn btn-warning btn-sm me-2 shadow-sm"
                    [routerLink]="['/edit', c._id]">
              Edit
            </button>

            <button class="btn btn-danger btn-sm shadow-sm"
                    (click)="delete(c)">
              Supprimer
            </button>
          </td>

        </tr>

      </tbody>

    </table>

  </div>

  <!-- ========================= -->
  <!-- 🎬 CARTES -->
  <!-- ========================= -->
  <div *ngIf="viewMode === 'card'" class="row">

    <div class="col-md-4 mb-4"
         *ngFor="let c of getFilteredCourses()">

      <div class="card course-card">

        <!-- IMAGE -->
        <img 
          [src]="c.image && c.image.startsWith('http') 
            ? c.image 
            : 'http://localhost:3000/uploads/' + c.image"
          class="card-img-top">

        <!-- CONTENU -->
        <div class="card-body">

          <h5 class="fw-bold">{{c.title}}</h5>

          <span class="badge mb-2"
            [ngClass]="{
              'bg-success': c.level === 'débutant',
              'bg-warning text-dark': c.level === 'intermédiaire',
              'bg-danger': c.level === 'avancé'
            }">
            {{c.level}}
          </span>

          <p class="text-muted">👨‍🏫 {{c.formateur}}</p>

        </div>

        <!-- ACTIONS -->
        <div class="card-footer text-center">

          <button class="btn btn-info btn-sm me-2"
                  [routerLink]="['/detail', c._id]">
            Voir
          </button>

          <button class="btn btn-warning btn-sm me-2"
                  [routerLink]="['/edit', c._id]">
            Edit
          </button>

          <button class="btn btn-danger btn-sm"
                  (click)="delete(c)">
            Supprimer
          </button>

        </div>

      </div>

    </div>

  </div>

</div>
